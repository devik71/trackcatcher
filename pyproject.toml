[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "djcheck"
version = "0.1.0"
description = "Local DJ set history checker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["typer>=0.12,<1", "mutagen>=1.47,<2", "rapidfuzz>=3,<4", "pyacoustid>=1.3,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
djcheck = "djcheck.cli:app"

[tool.setuptools.packages.find]
include = ["djcheck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
